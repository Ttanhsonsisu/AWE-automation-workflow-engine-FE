<!DOCTYPE html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AutoFlow - Workflow Automation Platform" />
    <title>AutoFlow - Workflow Automation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <!--
      config.js is generated at container startup by docker/entrypoint.sh.
      It sets window.__APP_CONFIG__ with runtime environment values.
      During local development (npm run dev), this file may not exist —
      src/lib/config.ts gracefully falls back to import.meta.env defaults.
    -->
    <script src="/config.js" onerror="console.warn('[config.js] Not found — using dev defaults')"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
