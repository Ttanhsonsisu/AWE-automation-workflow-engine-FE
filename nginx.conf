server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Runtime config — MUST NOT be cached so env changes take effect immediately
    # on container restart without a browser hard-refresh.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri =404;
    }

    # Serve static assets with long-term caching
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        # 1. Ép Nginx dùng DNS nội bộ của Docker (127.0.0.11)
        resolver 127.0.0.11 valid=30s;
        
        # 2. Dùng biến để Nginx KHÔNG kiểm tra trạng thái Backend lúc khởi động
        set $upstream_api http://api-gateway:8080;
        
        # Nếu Backend của bạn (API C#) có tiền tố /api/ trong route (ví dụ [Route("api/[controller]")]), 
        # hãy giữ nguyên dòng dưới đây:
        proxy_pass $upstream_api; 
        
        # (LƯU Ý: Nếu Backend C# KHÔNG có /api/ mà chỉ là /users, /login... 
        # hãy bỏ comment dòng dưới đây để Nginx cắt bỏ chữ /api/ đi)
        # rewrite ^/api/(.*)$ /$1 break;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # SỬA LỖI Ở ĐÂY: Tên biến đúng chuẩn của Nginx
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA: all other routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;
}
